<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi SUBSIE Administrator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            /* Tema Palet Warna Biru Modern */
            --bg-color: #f0f7ff;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --input-bg: #ffffff;

            /* Warna Biru khusus Pill Active Divisi */
            --blue-soft: #eff6ff;
            --blue-border: #93c5fd;
            --blue-text: #1d4ed8;

            /* Warna Utama Tombol & Accent */
            --primary-btn: #2563eb;
            --primary-btn-hover: #1d4ed8;

            --radius-md: 14px;
            --radius-lg: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 16px;
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        /* Header */
        .header {
            margin-bottom: 24px;
        }

        .badge {
            display: inline-block;
            padding: 6px 14px;
            border: 1px solid #bfdbfe;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #1e40af;
            background-color: #dbeafe;
            margin-bottom: 12px;
        }

        .title {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .date-container {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
        }

        .calendar-icon {
            stroke: var(--text-muted);
        }

        * {
            /* toogle dark mode */
          border: 0;
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        :root {
          --hue: 223;
          --trans-dur: 0.4s;
          --trans-timing: cubic-bezier(0.65,0,0.35,1);
          font-size: calc(40px + (80 - 40) * (100vw - 320px) / (2560 - 320));
        }
        body,
        input {
          color: hsl(var(--hue),10%,10%);
          font: 1em/1.5 sans-serif;
        }
        body {
          background-color: hsl(var(--hue),10%,90%);
          display: flex;
          height: 100vh;
          transition:
            background-color var(--trans-dur),
            color var(--trans-dur);
        }
        .switch,
        .switch__input {
          position: relative;
          -webkit-tap-highlight-color: transparent;
        }
        .switch {
          margin: auto;
        }
        .switch__input,
        .switch__input:before {
          background-color: hsl(var(--hue),10%,10%);
        }
        .switch__input {
          border-radius: 0.75em;
          cursor: pointer;
          display: block;
          width: 3em;
          height: 1.5em;
          transition: background-color var(--trans-dur) var(--trans-timing);
          -webkit-appearance: none;
          appearance: none;
        }
        .switch__input:before {
          border-radius: 50%;
          content: "";
          display: block;
          position: absolute;
          top: 0.125em;
          left: 0.125em;
          width: 1.25em;
          height: 1.25em;
          transition:
            background-color var(--trans-dur) var(--trans-timing),
            transform var(--trans-dur) var(--trans-timing);
        }
        .switch__icon,
        .switch__icon-part {
          display: block;
          position: absolute;
          top: 0;
          left: 0;
        }
        .switch__icon {
          background-color: hsl(var(--hue),10%,90%);
          border-radius: 50%;
          overflow: hidden;
          pointer-events: none;
          top: 0.125em;
          left: 0.125em;
          width: 1.25em;
          height: 1.25em;
          transition: transform var(--trans-dur) var(--trans-timing);
        }
        .switch__icon-part {
          transition:
            box-shadow var(--trans-dur) var(--trans-timing),
            transform var(--trans-dur) var(--trans-timing);
        }
        .switch__icon-part--1,
        .switch__icon-part--2,
        .switch__icon-part--3 {
          border-radius: 50%;
        }
        .switch__icon-part--1 {
          background-color: hsl(var(--hue),10%,90%);
          top: calc(50% - 0.375em);
          left: calc(50% - 0.375em);
          width: 0.75em;
          height: 0.75em;
        }
        .switch__icon-part--2 {
          background-color: hsl(var(--hue),10%,10%);
          top: calc(50% - 0.4375em);
          left: calc(50% - 0.0625em);
          width: 0.5em;
          height: 0.5em;
          transform: translate(-0.1875em,0.1875em) scale(0.2);
        }
        .switch__icon-part--3 {
          box-shadow: 0 0 0 0.625em hsl(var(--hue),10%,10%) inset;
          width: 1.25em;
          height: 1.25em;
          transform: scale(0.25);
        }
        .switch__icon-part--3 ~ .switch__icon-part {
          background-color: hsl(var(--hue),10%,10%);
          border-radius: 0.0625em;
          top: 50%;
          left: 50%;
          width: 0.125em;
          height: 0.1875em;
          transform-origin: 50% 0;
        }
        .switch__icon-part--4 {
          transform: translateX(-50%) rotate(0) translateY(0.25em);
        }
        .switch__icon-part--5 {
          transform: translateX(-50%) rotate(45deg) translateY(0.25em);
        }
        .switch__icon-part--6 {
          transform: translateX(-50%) rotate(90deg) translateY(0.25em);
        }
        .switch__icon-part--7 {
          transform: translateX(-50%) rotate(135deg) translateY(0.25em);
        }
        .switch__icon-part--8 {
          transform: translateX(-50%) rotate(180deg) translateY(0.25em);
        }
        .switch__icon-part--9 {
          transform: translateX(-50%) rotate(225deg) translateY(0.25em);
        }
        .switch__icon-part--10 {
          transform: translateX(-50%) rotate(270deg) translateY(0.25em);
        }
        .switch__icon-part--11 {
          transform: translateX(-50%) rotate(315deg) translateY(0.25em);
        }
        .switch__sr {
          overflow: hidden;
          position: absolute;
          width: 1px;
          height: 1px;
        }
        
        /* `:checked` state */
        .switch__input:checked {
          background-color: hsl(var(--hue),10%,90%);
        }
        .switch__input:checked:before,
        .switch__input:checked ~ .switch__icon {
          transform: translateX(1.5em);
        }
        .switch__input:checked ~ .switch__icon .switch__icon-part--2 {
          transform: translate(0,0) scale(1);
        }
        .switch__input:checked ~ .switch__icon .switch__icon-part--3 {
          box-shadow: 0 0 0 0.25em hsl(var(--hue),10%,10%) inset;
          transform: scale(1);
        }
        .switch__input:checked ~ .switch__icon .switch__icon-part--4 {
          transform: translateX(-50%) rotate(0) translateY(0.625em) scale(0);
        }
        .switch__input:checked ~ .switch__icon .switch__icon-part--5 {
          transform: translateX(-50%) rotate(45deg) translateY(0.625em) scale(0);
        }
        .switch__input:checked ~ .switch__icon .switch__icon-part--6 {
          transform: translateX(-50%) rotate(90deg) translateY(0.625em) scale(0);
        }
        .switch__input:checked ~ .switch__icon .switch__icon-part--7 {
          transform: translateX(-50%) rotate(135deg) translateY(0.625em) scale(0);
        }
        .switch__input:checked ~ .switch__icon .switch__icon-part--8 {
          transform: translateX(-50%) rotate(180deg) translateY(0.625em) scale(0);
        }
        .switch__input:checked ~ .switch__icon .switch__icon-part--9 {
          transform: translateX(-50%) rotate(225deg) translateY(0.625em) scale(0);
        }
        .switch__input:checked ~ .switch__icon .switch__icon-part--10 {
          transform: translateX(-50%) rotate(270deg) translateY(0.625em) scale(0);
        }
        .switch__input:checked ~ .switch__icon .switch__icon-part--11 {
          transform: translateX(-50%) rotate(315deg) translateY(0.625em) scale(0);
        }
        body:has(.switch__input:checked) {
          background-color: hsl(var(--hue),10%,10%);
          color: hsl(var(--hue),10%,90%);
        }
        /* Card Container */
        .card {
            background: var(--card-bg);
            border: 1px solid #e2e8f0;
            border-radius: var(--radius-lg);
            padding: 28px 24px;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.05);
            transition: all 0.3s ease;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="file"],
        select {
            width: 100%;
            padding: 12px 16px;
            font-size: 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background-color: var(--input-bg);
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
        }

        /* Style Khusus Dropdown Select */
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
            cursor: pointer;
        }

        input[type="text"]::placeholder {
            color: #94a3b8;
        }

        input[type="text"]:focus,
        select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        /* Pill Buttons */
        .pill-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .pill-btn {
            width: 100%;
            padding: 12px 16px;
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .pill-btn:hover {
            background-color: #f8fafc;
        }

        /* Active State - Soft Blue untuk Divisi */
        .pill-btn.active {
            background-color: var(--blue-soft);
            border-color: var(--blue-border);
            color: var(--blue-text);
        }

        /* Button Utama */
        .btn-primary {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-btn);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background-color: var(--primary-btn-hover);
        }

        .btn-primary:active {
            transform: scale(0.99);
        }

        /* Secret Link Footer */
        .footer {
            margin-top: 24px;
            text-align: center;
        }

        .secret-link {
            font-size: 12px;
            color: #64748b;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
        }

        .secret-link:hover {
            color: #2563eb;
        }

        /* Switcher Halaman */
        .hidden {
            display: none !important;
        }

        /* Toast Notifikasi */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: #0f172a;
            color: #fff;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 9999;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast.error {
            background-color: #ef4444;
        }

        /* Spinner Loading */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <label class="switch">
  <input class="switch__input" type="checkbox" role="switch" />
  <span class="switch__icon">
    <span class="switch__icon-part switch__icon-part--1"></span>
    <span class="switch__icon-part switch__icon-part--2"></span>
    <span class="switch__icon-part switch__icon-part--3"></span>
    <span class="switch__icon-part switch__icon-part--4"></span>
    <span class="switch__icon-part switch__icon-part--5"></span>
    <span class="switch__icon-part switch__icon-part--6"></span>
    <span class="switch__icon-part switch__icon-part--7"></span>
    <span class="switch__icon-part switch__icon-part--8"></span>
    <span class="switch__icon-part switch__icon-part--9"></span>
    <span class="switch__icon-part switch__icon-part--10"></span>
    <span class="switch__icon-part switch__icon-part--11"></span>
  </span>
  <span class="switch__sr">Dark Mode</span>
</label>
        <!-- ==================== HALAMAN 1: FORM PRESENSI ==================== -->
        <div id="viewPresensi">
            <header class="header">
                <div class="badge">TECHNICHAL MEETING</div>
                <h1 class="title">Presensi Administrator</h1>
                <div class="date-container">
                    <svg class="calendar-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    <span id="currentDate">Hari, Tanggal Bulan Tahun</span>
                </div>
            </header>

            <main class="card">
                <h2 class="card-title">Isi Presensi</h2>

                <form id="presensiForm">
                    <!-- Status dikirim tersembunyi sebagai 'Hadir' secara otomatis -->
                    <input type="hidden" id="status" name="status" value="Hadir">

                    <!-- Nama Lengkap -->
                    <div class="form-group">
                        <label for="nama">Nama lengkap</label>
                        <input type="text" id="nama" name="nama" placeholder="Contoh: Talulah Artorius" required
                            autocomplete="off">
                    </div>

                    <!-- Dropdown Kelas (QoL) -->

                    <div class="form-group">
                        <label for="kelas">Kelas</label>
                        <input type="text" id="kelas" name="kelas" placeholder="Contoh : XE 1" required
                            autocomplete="off">
                    </div>

                    <!-- Divisi Selection -->
                    <div class="form-group">
                        <label>Divisi</label>
                        <input type="hidden" id="divisi" name="divisi" required>
                        <div class="pill-group" id="divisiGroup">
                            <button type="button" class="pill-btn" data-value="Desain Grafis">Desain Grafis</button>
                            <button type="button" class="pill-btn" data-value="Jurnalistik">Jurnalistik</button>
                            <button type="button" class="pill-btn" data-value="Programming">Programming</button>
                        </div>
                    </div>

                    <!-- Catatan Opsional -->
                    <div class="form-group">
                        <label for="catatan">Catatan (opsional)</label>
                        <input type="text" id="catatan" name="catatan"
                            placeholder="Contoh: Terlambat 10 menit / Ada kegiatan" autocomplete="off">
                    </div>

                    <button type="submit" id="btnSubmit" class="btn-primary">
                        <span id="btnText">Kirim Presensi</span>
                        <div class="spinner" id="btnSpinner" style="display: none;"></div>
                    </button>
                </form>
            </main>

            <!-- Link Rahasia di bagian bawah -->
            <footer class="footer">
                <a id="btnSecretPage" class="secret-link" title="Upload Dokumen / Berkas Admin">
                    by administrator
                </a>
            </footer>
        </div>


        <!-- ==================== HALAMAN 2 (RAHASIA): UPLOAD FILE ==================== -->
        <div id="viewUpload" class="hidden">
            <header class="header">
                <div class="badge">RAHASIA / ADMIN ONLY</div>
                <h1 class="title">Upload Berkas Admin</h1>
                <p style="color: #64748b; font-size: 14px;">Unggah 1 sampai 3 file dokumen/bukti ke Google Drive &
                    Spreadsheet</p>
            </header>

            <main class="card">
                <h2 class="card-title">Upload File (Max 3 Files)</h2>

                <form id="uploadForm">
                    <div class="form-group">
                        <label for="uploaderNama">Nama Pengunggah</label>
                        <input type="text" id="uploaderNama" placeholder="Contoh: Admin Programming" required
                            autocomplete="off">
                    </div>

                    <div class="form-group">
                        <label for="keterangan">Keterangan Dokumen</label>
                        <input type="text" id="keterangan" placeholder="Contoh: Laporan / Bukti Surat" required
                            autocomplete="off">
                    </div>

                    <div class="form-group">
                        <label for="file1">File Utama (Wajib)</label>
                        <input type="file" id="file1" required>
                    </div>

                    <div class="form-group">
                        <label for="file2">File Tambahan 1 (Opsional)</label>
                        <input type="file" id="file2">
                    </div>

                    <div class="form-group">
                        <label for="file3">File Tambahan 2 (Opsional)</label>
                        <input type="file" id="file3">
                    </div>

                    <button type="submit" id="btnUpload" class="btn-primary">
                        <span id="btnUploadText">Upload ke Spreadsheet</span>
                        <div class="spinner" id="btnUploadSpinner" style="display: none;"></div>
                    </button>
                </form>
            </main>

            <footer class="footer">
                <a id="btnBackPresensi" class="secret-link">← Kembali ke Form Presensi</a>
            </footer>
        </div>

    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- JavaScript Logic -->
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyQ5lEYE1VGJpk3zWW821AtnxZZdhgYnNcFeEsxhVfDTf-5q0uUhIvA417UBvJss2RW/exec";

        document.addEventListener('DOMContentLoaded', () => {
            // Tanggal Otomatis Format Indonesia
            const dateElement = document.getElementById('currentDate');
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            dateElement.textContent = new Date().toLocaleDateString('id-ID', options);

            // Switcher Tampilan (Form Utama <-> Form Upload Rahasia)
            const viewPresensi = document.getElementById('viewPresensi');
            const viewUpload = document.getElementById('viewUpload');
            const btnSecretPage = document.getElementById('btnSecretPage');
            const btnBackPresensi = document.getElementById('btnBackPresensi');

            btnSecretPage.addEventListener('click', () => {
                viewPresensi.classList.add('hidden');
                viewUpload.classList.remove('hidden');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            btnBackPresensi.addEventListener('click', () => {
                viewUpload.classList.add('hidden');
                viewPresensi.classList.remove('hidden');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // Selection Button Divisi (Soft Blue Highlight)
            const divisiButtons = document.querySelectorAll('#divisiGroup .pill-btn');
            const divisiInput = document.getElementById('divisi');

            divisiButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    divisiButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    divisiInput.value = btn.dataset.value;
                });
            });

            // Handler Form Presensi
            const presensiForm = document.getElementById('presensiForm');
            const btnSubmit = document.getElementById('btnSubmit');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            presensiForm.addEventListener('submit', (e) => {
                e.preventDefault();

                if (!divisiInput.value) {
                    showToast('Silakan pilih Divisi terlebih dahulu!', true);
                    return;
                }

                btnSubmit.disabled = true;
                btnText.textContent = 'Mengirim...';
                btnSpinner.style.display = 'block';

                const formData = new FormData(presensiForm);
                formData.append('action', 'presensi');

                fetch(SCRIPT_URL, { method: 'POST', body: formData })
                    .then(res => res.json())
                    .then(response => {
                        if (response.result === 'success') {
                            showToast('✅ Presensi berhasil dikirim!');
                            presensiForm.reset();
                            divisiButtons.forEach(b => b.classList.remove('active'));
                            divisiInput.value = '';
                        } else {
                            showToast('❌ Gagal: ' + (response.error || 'Terjadi kesalahan'), true);
                        }
                    })
                    .catch(error => {
                        console.error('Error!', error);
                        showToast('❌ Gagal mengirim. Cek URL Google Script.', true);
                    })
                    .finally(() => {
                        btnSubmit.disabled = false;
                        btnText.textContent = 'Kirim Presensi';
                        btnSpinner.style.display = 'none';
                    });
            });

            // Handler Form Secret Upload
            const uploadForm = document.getElementById('uploadForm');
            const btnUpload = document.getElementById('btnUpload');
            const btnUploadText = document.getElementById('btnUploadText');
            const btnUploadSpinner = document.getElementById('btnUploadSpinner');

            uploadForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const file1 = document.getElementById('file1').files[0];
                const file2 = document.getElementById('file2').files[0];
                const file3 = document.getElementById('file3').files[0];

                btnUpload.disabled = true;
                btnUploadText.textContent = 'Memproses File...';
                btnUploadSpinner.style.display = 'block';

                try {
                    const file1Data = file1 ? await fileToBase64(file1) : null;
                    const file2Data = file2 ? await fileToBase64(file2) : null;
                    const file3Data = file3 ? await fileToBase64(file3) : null;

                    const payload = {
                        action: 'upload',
                        nama: document.getElementById('uploaderNama').value,
                        keterangan: document.getElementById('keterangan').value,
                        files: [file1Data, file2Data, file3Data].filter(f => f !== null)
                    };

                    btnUploadText.textContent = 'Mengunggah...';

                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });

                    const result = await response.json();

                    if (result.result === 'success') {
                        showToast('✅ Berkas berhasil diunggah ke Drive & Spreadsheet!');
                        uploadForm.reset();
                    } else {
                        showToast('❌ Gagal: ' + (result.error || 'Terjadi kesalahan'), true);
                    }
                } catch (err) {
                    console.error(err);
                    showToast('❌ Terjadi kesalahan saat mengunggah file.', true);
                } finally {
                    btnUpload.disabled = false;
                    btnUploadText.textContent = 'Upload ke Spreadsheet';
                    btnUploadSpinner.style.display = 'none';
                }
            });
        });

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => {
                    resolve({
                        fileName: file.name,
                        mimeType: file.type,
                        base64: reader.result.split(',')[1]
                    });
                };
                reader.onerror = error => reject(error);
            });
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            if (isError) toast.classList.add('error');
            else toast.classList.remove('error');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }
    </script>
</body>

</html>
